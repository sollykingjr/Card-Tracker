name = "card-app"
main = "worker.js"
compatibility_date = "2024-01-01"

[vars]

[triggers]
crons = ["0 * * * *", "0 5 * * *", "0 10 * * *", "0 12 * * *", "*/15 * * * *"]

[observability]
enabled = true

[observability.logs]
enabled = true

[[kv_namespaces]]
binding = "CACHE"
id = "23e104faac8545dcb39b9283bf368a9b"

# Card database (replaces the Excel / Power Query pipeline)
[[d1_databases]]
binding = "DB"
database_name = "card-tracker-staging"  # name kept from staging; this is the live card database
database_id = "0d2cff81-a05d-4728-a04a-9cb9ec12ec61"

[limits]
cpu_ms = 30000
