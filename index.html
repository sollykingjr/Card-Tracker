<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f7f5ef">
<title>Card Collection</title>
<link rel="stylesheet" href="css/styles.css?v=3aeebc32">
</head>
<body>

<div class="top-tabs" id="toptabs">
  <button class="top-tab" data-s="home">Home</button>
  <button class="top-tab" data-s="cardtracker">Card Collection</button>
  <button class="top-tab" data-s="portfolio">Portfolio</button>
  <button class="top-tab" data-s="searchresults">Search Results</button>
  <button class="top-tab" data-s="watchlist">eBay Watchlist</button>
  <button class="top-tab" data-s="ebaylistings">eBay Listings</button>
  <button class="top-tab" data-s="prospects">Prospects</button>
  <button class="top-tab" data-s="searchbuilder">Search Builder</button>
  <button class="top-tab" data-s="settings">Settings</button>
</div>

<div id="prospects-section">
  <div class="tabs" id="tabs">
    <button class="tab on" data-t="all">All</button>
    <button class="tab" data-t="posts">Posts</button>
    <button class="tab" data-t="port">Portfolio</button>
    <button class="tab" data-t="inbox" id="tab-inbox">Inbox</button>
  </div>
  <div class="hdr" id="hdr">
    <div class="si">
      <input id="search" placeholder="Search player or team..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <button id="clear">×</button>
    </div>
  </div>
</div>

<div class="meta"><span id="cntlbl">Loading...</span><div class="sort-chips" id="sortchips"></div></div>
<div class="list" id="list"><div class="spin"><div class="spin-ring"></div>Loading...</div></div>

<button class="rfab" id="rfab" title="Refresh">
  <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4c-4.42 0-8 3.58-8 8s3.58 8 8 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
</button>

<div id="sb-root" style="display:none"></div>
<div id="sr-root" style="display:none"></div>
<div id="home-root" style="display:none"></div>
<div id="cardtracker-root" style="display:none"></div>
<div id="portfolio-root" style="display:none"></div>
<div id="settings-root" style="display:none"></div>
<div id="ebaylistings-root" style="display:none"></div>

<div class="mwrap" id="mwrap">
  <div class="modal">
    <div class="mhandle"></div>
    <div id="mcontent"></div>
    <button class="close-btn" id="closebtn">Close</button>
  </div>
</div>

<div class="mwrap" id="ct-filter-wrap">
  <div class="modal">
    <div class="mhandle"></div>
    <div id="ct-filter-content"></div>
    <button class="close-btn" onclick="ctCloseFilters()">Done</button>
  </div>
</div>

<div class="mwrap" id="intake-wrap">
  <div class="modal">
    <div class="mhandle"></div>
    <div id="intake-content"></div>
    <button class="close-btn" onclick="intakeClose()">Done</button>
  </div>
</div>

<script src="js/config.js?v=2fb0b349" defer></script>
<script src="js/search-builder.js?v=afc62e47" defer></script>
<script src="js/sheets.js?v=59a4aa8a" defer></script>
<script src="js/watchlist.js?v=38e454de" defer></script>
<script src="js/render.js?v=db4a90a3" defer></script>
<script src="js/ebay-search-results.js?v=7b0ebb35" defer></script>
<script src="js/prospect-watch.js?v=1ed8a587" defer></script>
<script src="js/home.js?v=0cb58106" defer></script>
<script src="js/cardtracker.js?v=7ba9902b" defer></script>
<script src="js/search-editor.js?v=6e9319a5" defer></script>
<script src="js/settings.js?v=0b12f9e7" defer></script>
<script src="js/ebay-listing.js?v=df5d89ff" defer></script>
<script src="js/ebay-my-listings.js?v=7cbba5cb" defer></script>
<script src="js/portfolio.js?v=6a34ce20" defer></script>
<script src="js/intake.js?v=8f4b1f02" defer></script>
<script src="js/prospect-inbox.js?v=c8b528d5" defer></script>
<script src="js/prospect-posts.js?v=457f5503" defer></script>
<script src="js/prospect-home.js?v=9f136a64" defer></script>
<script src="js/prospect-modal.js?v=b946d647" defer></script>
<script src="js/prospect-portfolio.js?v=c63d130b" defer></script>
<script src="js/app.js?v=2e93f21d" defer></script>
</body>
</html>
